<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Rechercher des Trajets</title><link rel="stylesheet" th:href="@{/css/style.css}"><style>.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center}.modal.active{display:flex}.modal-content{background:#fff;border-radius:8px;padding:24px;max-width:500px;box-shadow:0 4px 16px rgba(0,0,0,0.2)}.modal-content h2{margin-top:0;color:#333}.modal-content p{color:#666;margin:12px 0}.confirmation-details{background:#f5f5f5;padding:16px;border-radius:6px;margin:16px 0}.confirmation-details div{margin:8px 0;display:flex;justify-content:space-between}.confirmation-details strong{color:#333}.confirmation-details span{color:#666}.modal-actions{display:flex;gap:12px;margin-top:24px;justify-content:flex-end}.modal-actions button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:600}.confirm-btn{background:#4CAF50;color:white}.confirm-btn:hover{background:#45a049}.cancel-btn{background:#f0f0f0;color:#333}.cancel-btn:hover{background:#e0e0e0}</style></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: sidebar('passager','Espace Passager','Trouvez votre trajet','search')}"></nav>
    <main class="content">
        <div class="page-header"><div><h1>Rechercher des Trajets</h1><p>Filtres et liste des trajets disponibles</p></div></div>
        <form class="filter" th:action="@{/passager/trajets}" method="get">
            <strong>Filtres:</strong>
            <input name="depart" th:value="${depart}" placeholder="Ville de depart...">
            <input name="arrivee" th:value="${arrivee}" placeholder="Ville d'arrivee...">
            <button class="sky">Filtrer</button>
            <a class="secondary" th:href="@{/passager/trajets}">Reset</a>
        </form>
        <table>
            <thead><tr><th>Conducteur</th><th>Depart</th><th>Arrivee</th><th>Duree</th><th>Prix (TND)</th><th>Places</th><th>Voiture</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="t : ${trajets}">
                <td th:text="${t.conducteurCin}">Conducteur</td>
                <td th:text="${t.depart}"></td>
                <td th:text="${t.arrivee}"></td>
                <td th:text="${t.dureeMinutes + ' min'}"></td>
                <td th:text="${t.prix}"></td>
                <td th:text="${t.availablePlaces}"></td>
                <td>Voiture</td>
                <td class="row-actions">
                    <button type="button" class="mint" th:disabled="${t.availablePlaces <= 0}" th:attr="onclick=|openConfirmation(${t.id}, '${t.depart}', '${t.arrivee}', ${t.prix}, ${t.availablePlaces}, '${t.conducteurCin}')|">Reserver ce Trajet</button>
                    <button type="button" class="sky" th:attr="onclick=|alert('Conducteur: ${t.conducteurCin}\\nDepart: ${t.depart}\\nArrivee: ${t.arrivee}\\nPrix: ${t.prix} TND\\nPlaces: ${t.availablePlaces}')|">Voir plus</button>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>

<div id="confirmationModal" class="modal">
    <div class="modal-content">
        <h2>Confirmer la Réservation</h2>
        <p>Voulez-vous vraiment réserver ce trajet ?</p>
        <div class="confirmation-details">
            <div><strong>Conducteur:</strong> <span id="modalConducteur"></span></div>
            <div><strong>Départ:</strong> <span id="modalDepart"></span></div>
            <div><strong>Arrivée:</strong> <span id="modalArrivee"></span></div>
            <div><strong>Prix:</strong> <span id="modalPrix"></span> TND</div>
            <div><strong>Places:</strong> <span id="modalPlaces"></span></div>
        </div>
        <div class="modal-actions">
            <button type="button" class="cancel-btn" onclick="closeConfirmation()">Annuler</button>
            <button type="button" class="confirm-btn" onclick="submitReservation()">Confirmer la Réservation</button>
        </div>
    </div>
</div>

<form id="reservationForm" style="display:none;" method="post"></form>

<script>
let currentTrajetId = null;

function openConfirmation(id, depart, arrivee, prix, places, conducteur) {
    currentTrajetId = id;
    document.getElementById('modalConducteur').textContent = conducteur;
    document.getElementById('modalDepart').textContent = depart;
    document.getElementById('modalArrivee').textContent = arrivee;
    document.getElementById('modalPrix').textContent = prix;
    document.getElementById('modalPlaces').textContent = places;
    document.getElementById('confirmationModal').classList.add('active');
}

function closeConfirmation() {
    document.getElementById('confirmationModal').classList.remove('active');
    currentTrajetId = null;
}

function submitReservation() {
    if (currentTrajetId) {
        const form = document.getElementById('reservationForm');
        form.action = '/passager/trajets/' + currentTrajetId + '/reserve';
        form.submit();
    }
}

document.getElementById('confirmationModal').addEventListener('click', function(e) {
    if (e.target === this) closeConfirmation();
});
</script>
</body>
</html>
