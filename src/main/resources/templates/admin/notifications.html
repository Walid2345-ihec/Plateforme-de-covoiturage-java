<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Notifications Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: sidebar('admin','Administration','Gestion du systeme','notifications')}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Notifications admin</h1><p>Cloche admin <span class="badge" th:text="${unreadCount}">0</span></p></div>
            <form th:action="@{/admin/notifications/read-all}" method="post"><button class="gold">Marquer tout comme lu</button></form>
        </div>
        <section class="panel-card">
            <h2>Aide</h2>
            <article class="message-row" th:each="n : ${helpRequests}"><strong class="badge badge-sky">HELP</strong><p th:text="${n.message}"></p><small th:text="${n.dateCreation}"></small></article>
        </section>
        <section class="panel-card">
            <h2>Reclamations</h2>
            <article class="message-row" th:each="n : ${reclamations}"><strong class="badge badge-danger">RECLAMATION</strong><p th:text="${n.message}"></p><small th:text="${n.dateCreation}"></small></article>
        </section>
        <section class="panel-card">
            <h2>Messages</h2>
            <article class="message-row" th:each="c : ${adminMessages}" style="background-color: #e8f5e9; border-left: 4px solid #4caf50;">
                <strong class="badge" style="background: #4caf50;">MESSAGE</strong>
                <p th:text="${'Conversation avec ' + c.userName}"></p>
                <small th:text="${c.createdAt}"></small>
            </article>
        </section>
    </main>
</div>
</body>
</html>
