<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Notifications Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: sidebar('admin','Administration','Gestion du systeme','notifications')}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Notifications admin</h1><p>Cloche admin <span class="badge" th:text="${unreadCount}">0</span></p></div>
            <form th:action="@{/admin/notifications/read-all}" method="post"><button class="gold">Marquer tout comme lu</button></form>
        </div>
        <section class="panel-card">
            <h2>Demandes d'aide</h2>
            <article class="message-row" th:each="n : ${helpRequests}"><strong class="badge" style="background:#3498DB">HELP</strong><p th:text="${n.message}"></p><small th:text="${n.dateCreation}"></small></article>
        </section>
        <section class="panel-card">
            <h2>Reclamations</h2>
            <article class="message-row" th:each="n : ${reclamations}"><strong class="badge" style="background:#E74C3C">RECLAMATION</strong><p th:text="${n.message}"></p><small th:text="${n.dateCreation}"></small></article>
        </section>
        <section class="panel-card">
            <h2>Plaintes</h2>
            <article class="message-row" th:each="n : ${complaints}"><strong class="badge" style="background:#E74C3C">COMPLAINT</strong><p th:text="${n.message}"></p><small th:text="${n.dateCreation}"></small></article>
        </section>
        <div class="list">
            <article class="message-row" th:each="n : ${notifications}">
                <strong th:text="${n.type}"></strong>
                <p th:text="${n.message}"></p>
                <small th:text="${n.dateCreation}"></small>
            </article>
        </div>
    </main>
</div>
</body>
</html>
