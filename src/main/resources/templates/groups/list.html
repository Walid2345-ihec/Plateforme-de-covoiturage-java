<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mes Groupes</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: sidebar(${role},'Mes Groupes','Discussions de trajet','groups')}"></nav>
    <main class="content">
        <div class="page-header">
            <div><h1>Mes Groupes</h1><p>Discussions de covoiturage</p></div>
            <a class="secondary" th:href="@{/groups}">Actualiser</a>
        </div>
        <section class="form-card wide" th:if="${role == 'conducteur'}">
            <h2>Creer un groupe</h2>
            <div th:if="${!trajets.isEmpty()}">
                <p>Selectionnez un trajet pour creer un groupe avec ses passagers acceptes:</p>
                <div th:each="t : ${trajets}" class="trip-option">
                    <div>
                        <strong th:text="${t.depart + ' -> ' + t.arrivee}"></strong>
                        <span th:if="${t.acceptedCins}" class="mask-cins" th:text="${t.acceptedCins}"></span>
                    </div>
                    <form th:action="@{/groups}" method="post">
                        <input name="groupName" placeholder="Nom du groupe" required>
                        <input name="memberCins" th:value="${t.acceptedCins}" type="hidden">
                        <button class="primary" th:disabled="${t.acceptedCins == null || t.acceptedCins.isEmpty()}">Creer le groupe</button>
                    </form>
                </div>
            </div>
            <div th:if="${trajets.isEmpty()}">
                <p>Aucun trajet avec passagers acceptes. <a th:href="@{/conducteur/passagers}">Voir mes passagers</a></p>
            </div>
        </section>
        <section class="group-cards">
            <article class="group-card" th:each="g : ${groups}">
                <div>
                    <h2 th:text="${g.groupName}">Groupe</h2>
                    <p>Membres: <span class="mask-cins" th:text="${g.memberCins}">-</span></p>
                    <p th:text="${'Cree le ' + g.dateCreation}">Date</p>
                    <p>Conducteur: <span class="mask-cins" th:text="${g.conducteurCin}"></span></p>
                </div>
                <a class="primary" th:href="@{/groups/{id}(id=${g.groupId})}">Ouvrir la discussion</a>
            </article>
            <p class="empty-state" th:if="${groups.isEmpty()}">Aucun groupe pour le moment.</p>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
// Convert CINs to names
const usersMap = {};
[[${#lists.isEmpty(passagers) ? 'null' : passagers}]] && [[${passagers}]].forEach(u => {
    usersMap[u.cin] = u.prenom + ' ' + u.nom;
});
[[${#lists.isEmpty(conducteurs) ? 'null' : conducteurs}]] && [[${conducteurs}]].forEach(u => {
    usersMap[u.cin] = u.prenom + ' ' + u.nom;
});

function convertCinsToNames(cinsString) {
    if (!cinsString || cinsString === '-') return cinsString;
    return cinsString.split(',').map(cin => {
        const c = cin.trim();
        return usersMap[c] || maskCin(c);
    }).join(', ');
}

document.addEventListener('DOMContentLoaded', function() {
    // Handle trip CINs in "Create Group" section
    document.querySelectorAll('.trip-option span.mask-cins').forEach(el => {
        const cinsString = el.textContent.trim();
        if (cinsString) {
            el.textContent = convertCinsToNames(cinsString);
        }
    });
    
    // Handle group members and conductors
    document.querySelectorAll('.group-card').forEach(card => {
        const memberSpan = card.querySelector('p:nth-child(2) span');
        const conductorSpan = card.querySelector('p:nth-child(4) span');
        
        if (memberSpan && memberSpan.textContent) {
            memberSpan.textContent = convertCinsToNames(memberSpan.textContent.trim());
        }
        if (conductorSpan && conductorSpan.textContent) {
            conductorSpan.textContent = convertCinsToNames(conductorSpan.textContent.trim());
        }
    });
});
</script>
</body>
</html>
