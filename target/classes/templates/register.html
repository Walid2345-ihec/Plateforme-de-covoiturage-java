<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Inscription</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="login-page">
<main class="form-card wide">
    <h1 th:text="${form.role == 'conducteur' ? 'Inscription Conducteur' : 'Inscription Passager'}">Inscription</h1>
    <form th:action="@{/register}" th:object="${form}" method="post" class="grid-form">
        <input type="hidden" th:field="*{role}">
        <h3 class="full">Informations Personnelles</h3>
        <label>CIN<input th:field="*{cin}" placeholder="12345678"></label>
        <label>Nom<input th:field="*{nom}" placeholder="Votre nom"></label>
        <label>Prenom<input th:field="*{prenom}" placeholder="Votre prenom"></label>
        <label>Telephone<input th:field="*{tel}" placeholder="12 345 678"></label>
        <label>Annee Univ.<input th:field="*{anneeUniv}" placeholder="2024"></label>
        <label>Email<input th:field="*{mail}" placeholder="email@gmail.com"></label>
        <label class="full">Adresse<input th:field="*{adresse}" placeholder="Votre adresse"></label>
        <h3 class="full">Creer un mot de passe</h3>
        <label>Mot de passe<input th:field="*{password}" type="password" placeholder="Mot de passe"></label>
        <label>Confirmer<input name="confirmPassword" type="password" placeholder="Confirmer"></label>
        <h3 class="full" th:if="${form.role == 'conducteur'}">Informations Vehicule</h3>
        <label th:if="${form.role == 'conducteur'}">Nom Vehicule<input th:field="*{nomVoiture}" placeholder="Golf 7, Clio 4..."></label>
        <label th:if="${form.role == 'conducteur'}">Marque<input th:field="*{marqueVoiture}" placeholder="Peugeot, Renault..."></label>
        <label th:if="${form.role == 'conducteur'}">Matricule<input th:field="*{matricule}" placeholder="123TU4567"></label>
        <label th:if="${form.role == 'conducteur'}">Places<input th:field="*{placesDisponibles}" type="number" min="1" max="8"></label>
        <div class="full actions">
            <a class="secondary" th:href="@{/}">Annuler</a>
            <button class="primary">S'inscrire</button>
        </div>
    </form>
</main>
</body>
</html>
